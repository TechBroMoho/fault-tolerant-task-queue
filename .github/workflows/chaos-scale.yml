# The N=1,000,000 chaos run (SPEC §7 Phase 5 scale decision, ADR-040): nightly, and by
# hand with any N / worker count. Not per push: 1M took 34 min 48 s on this runner
# (run 35838910547), and the SPEC's per-push bar is ~12 min. Per push, ci.yml runs 100K.

name: chaos-scale

on:
  schedule:
    - cron: "23 9 * * *"  # daily 09:23 UTC; off the hour, when scheduled runs pile up
  workflow_dispatch:
    inputs:
      jobs:
        description: "Jobs to enqueue (N)"
        default: "1000000"
      workers:
        description: "Worker containers (default: one per vCPU, ADR-040)"
        default: "nproc"
      drain_timeout:
        description: "Seconds to wait for the queue to drain after the fault phase"
        default: "3600"

permissions:
  contents: read

jobs:
  chaos:
    runs-on: ubuntu-24.04
    # ~2.5x the measured 1M step (35 min), so a slow night isn't cut off mid-verify.
    timeout-minutes: 90
    env:
      # A scheduled run has no inputs: the same defaults as a manual one.
      CHAOS_JOBS: ${{ inputs.jobs || '1000000' }}
      DRAIN_TIMEOUT: ${{ inputs.drain_timeout || '3600' }}
      CHAOS_WORKERS: ${{ inputs.workers || 'nproc' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.16"
          python-version: "3.12.13"  # the local + Docker image patch release
          enable-cache: true
      - run: make setup
      - name: Runner facts
        run: nproc; free -m; df -h /; docker version --format '{{.Server.Version}}'
      - name: Chaos run (N=${{ env.CHAOS_JOBS }}, workers=${{ env.CHAOS_WORKERS }}, random seed)
        run: |
          [ "$CHAOS_WORKERS" = nproc ] && CHAOS_WORKERS=$(nproc)
          start=$(date +%s)
          uv run python -m chaos.run --jobs "$CHAOS_JOBS" --workers "$CHAOS_WORKERS" \
            --drain-timeout "$DRAIN_TIMEOUT" \
            --out results/ci/chaos_report.json --run-dir "$PWD/chaos/runs/ci"
          echo "chaos N=$CHAOS_JOBS workers=$CHAOS_WORKERS wall time: $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the chaos report and worker logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: chaos-report-${{ github.run_id }}
          path: |
            results/ci/chaos_report.json
            chaos/runs/ci/
          if-no-files-found: warn
          retention-days: 30
