# Large chaos runs (SPEC §7 Phase 5 scale decision, ADR-039), started by hand with any N.
# Used to measure how long N=1,000,000 takes on a GitHub-hosted runner.

name: chaos-scale

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Jobs to enqueue (N)"
        default: "1000000"
      drain_timeout:
        description: "Seconds to wait for the queue to drain after the fault phase"
        default: "3600"

permissions:
  contents: read

jobs:
  chaos:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CHAOS_JOBS: ${{ inputs.jobs }}
      DRAIN_TIMEOUT: ${{ inputs.drain_timeout }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.16"
          python-version: "3.12.13"  # the local + Docker image patch release
          enable-cache: true
      - run: make setup
      - name: Runner facts
        run: nproc; free -m; df -h /; docker version --format '{{.Server.Version}}'
      - name: Chaos run (N=${{ env.CHAOS_JOBS }}, 8 workers, random seed)
        run: |
          start=$(date +%s)
          uv run python -m chaos.run --jobs "$CHAOS_JOBS" --workers 8 \
            --drain-timeout "$DRAIN_TIMEOUT" \
            --out results/ci/chaos_report.json --run-dir "$PWD/chaos/runs/ci"
          echo "chaos N=$CHAOS_JOBS wall time: $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the chaos report and worker logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: chaos-report-${{ github.run_id }}
          path: |
            results/ci/chaos_report.json
            chaos/runs/ci/
          if-no-files-found: warn
          retention-days: 30
