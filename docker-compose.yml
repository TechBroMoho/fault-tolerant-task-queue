# Local topology: Redis plus N identical worker processes (`make up WORKERS=4`).
# The chaos topology with one Toxiproxy proxy per worker is generated in Phase 4
# (DECISIONS.md ADR-011).
name: ftq

services:
  redis:
    # Pinned; classic stream commands only so we stay portable to Redis/Valkey 7.x (ADR-004).
    image: redis:8.8.3
    command:
      - redis-server
      # AOF with fsync once per second: a Redis crash can lose up to ~1 s of writes.
      # Redis data loss is outside the zero-loss claim (SPEC §4, ADR-013).
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      # Hard memory cap with noeviction: when full, writes fail loudly instead of
      # silently evicting idempotency keys (ADR-013).
      - --maxmemory
      - 2gb
      - --maxmemory-policy
      - noeviction
    ports:
      # Loopback only: never expose an unauthenticated Redis beyond this machine.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ftq-worker:local
    # Not started by a plain `make up` (tests only need Redis); `make up WORKERS=N`
    # enables the profile and scales it.
    profiles: ["workers"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      FTQ_REDIS_URL: redis://redis:6379/0
      FTQ_QUEUE: ${FTQ_QUEUE:-default}
      FTQ_CONCURRENCY: ${FTQ_CONCURRENCY:-10}
      FTQ_LOG_LEVEL: ${FTQ_LOG_LEVEL:-INFO}
    # docker stop sends SIGTERM, waits this long, then SIGKILL. Longer than the worker's
    # own grace period, so a drain is never cut short by Docker.
    stop_grace_period: 40s
    restart: unless-stopped
